# Catalogue CI — validate, generate schemas/templates, refresh in-repo docs, build explorer.
#
# Requires repo or org secrets to clone private OpenTideHQ/opentide (and explorer):
#   - GH_APP_ID + GH_APP_KEY (GitHub App with contents:read on opentide + explorer), or
#   - OPENTIDE_REPO_TOKEN (PAT/fine-grained token with contents:read on those repos), or
#   - OPENTIDE_DEPLOY_KEY / EXPLORER_DEPLOY_KEY (read-only deploy keys)
name: OpenTide

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-and-generate:
    name: Validate and generate
    runs-on: ubuntu-latest
    env:
      HAS_GITHUB_APP: ${{ secrets.GH_APP_ID && secrets.GH_APP_KEY && 'true' || 'false' }}
      HAS_DEPLOY_KEY: ${{ secrets.OPENTIDE_DEPLOY_KEY && 'true' || 'false' }}
      HAS_REPO_TOKEN: ${{ secrets.OPENTIDE_REPO_TOKEN && 'true' || 'false' }}
    steps:
      - name: Checkout library
        uses: actions/checkout@v4

      - name: Require private-repo credentials
        if: ${{ env.HAS_DEPLOY_KEY != 'true' && env.HAS_GITHUB_APP != 'true' && env.HAS_REPO_TOKEN != 'true' }}
        run: |
          echo "::error::Missing credentials to clone private OpenTideHQ/opentide."
          echo "Configure one of: GH_APP_ID+GH_APP_KEY, OPENTIDE_REPO_TOKEN, or OPENTIDE_DEPLOY_KEY."
          exit 1

      - name: Generate GitHub App token
        id: generate_token
        if: ${{ env.HAS_DEPLOY_KEY != 'true' && env.HAS_GITHUB_APP == 'true' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_KEY }}
          owner: OpenTideHQ
          repositories: opentide,explorer

      - name: Checkout opentide (deploy key)
        if: ${{ env.HAS_DEPLOY_KEY == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: OpenTideHQ/opentide
          ref: development
          path: opentide
          ssh-key: ${{ secrets.OPENTIDE_DEPLOY_KEY }}

      - name: Checkout opentide (token)
        if: ${{ env.HAS_DEPLOY_KEY != 'true' }}
        uses: actions/checkout@v4
        with:
          repository: OpenTideHQ/opentide
          ref: development
          path: opentide
          token: ${{ steps.generate_token.outputs.token || secrets.OPENTIDE_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install opentide
        run: pip install -e "./opentide[cli]"

      - name: Generate schemas and templates
        run: |
          python scripts/opentide_run.py generate schemas
          python scripts/opentide_run.py generate templates
        env:
          OPENTIDE_REPO_ROOT: ${{ github.workspace }}

      - name: Validate objects
        run: python scripts/opentide_run.py validate --strict
        env:
          OPENTIDE_REPO_ROOT: ${{ github.workspace }}

      - name: Generate documentation
        run: python scripts/opentide_run.py generate docs --output docs --flavor github
        env:
          OPENTIDE_REPO_ROOT: ${{ github.workspace }}

  explorer:
    name: Build explorer
    runs-on: ubuntu-latest
    needs: validate-and-generate
    env:
      HAS_GITHUB_APP: ${{ secrets.GH_APP_ID && secrets.GH_APP_KEY && 'true' || 'false' }}
      HAS_OPENTIDE_DEPLOY_KEY: ${{ secrets.OPENTIDE_DEPLOY_KEY && 'true' || 'false' }}
      HAS_EXPLORER_DEPLOY_KEY: ${{ secrets.EXPLORER_DEPLOY_KEY && 'true' || 'false' }}
    steps:
      - name: Checkout library
        uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: generate_token
        if: ${{ env.HAS_GITHUB_APP == 'true' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_KEY }}
          owner: OpenTideHQ
          repositories: opentide,explorer

      - name: Checkout opentide (deploy key)
        if: ${{ env.HAS_OPENTIDE_DEPLOY_KEY == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: OpenTideHQ/opentide
          ref: development
          path: opentide
          ssh-key: ${{ secrets.OPENTIDE_DEPLOY_KEY }}

      - name: Checkout opentide (token)
        if: ${{ env.HAS_OPENTIDE_DEPLOY_KEY != 'true' }}
        uses: actions/checkout@v4
        with:
          repository: OpenTideHQ/opentide
          ref: development
          path: opentide
          token: ${{ steps.generate_token.outputs.token || secrets.OPENTIDE_REPO_TOKEN }}

      - name: Checkout explorer (deploy key)
        if: ${{ env.HAS_EXPLORER_DEPLOY_KEY == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: OpenTideHQ/explorer
          ref: main
          path: explorer
          ssh-key: ${{ secrets.EXPLORER_DEPLOY_KEY }}

      - name: Checkout explorer (token)
        if: ${{ env.HAS_EXPLORER_DEPLOY_KEY != 'true' }}
        uses: actions/checkout@v4
        with:
          repository: OpenTideHQ/explorer
          ref: main
          path: explorer
          token: ${{ steps.generate_token.outputs.token || secrets.OPENTIDE_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install opentide
        run: pip install -e "./opentide[cli]"

      - name: Build explorer static site
        run: opentide explorer build --output ./out/explorer --base-path /library
        env:
          OPENTIDE_REPO_ROOT: ${{ github.workspace }}
          OPENTIDE_EXPLORER_PATH: ${{ github.workspace }}/explorer

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out/explorer

  deploy-explorer:
    name: Deploy explorer to GitHub Pages
    runs-on: ubuntu-latest
    needs: explorer
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
