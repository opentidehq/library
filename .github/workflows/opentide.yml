# Catalogue CI — shape tests, PyPI validate, development-HEAD early warning.
#
# opentide, explorer, and specifications are public. Do not require GH App / PAT /
# deploy-key credentials to clone them.
#
# The published-user contract is the PyPI job:
#   pip install opentide
#   opentide validate --strict
#
# threat.impact / threat.leverage are YAML lists (library#7, threat-1.0).
# opentide 0.14.0 types those fields as list[VocabName] natively, so the former
# patch_opentide_threat_lists.py workaround (opentide#189) is no longer needed
# and has been removed. Do not collapse catalogue YAML back to strings.
#
# Explorer GitHub Pages lives in explorer-pages.yml so catalogue validate
# and Pages deploy stay independently visible.
name: opentide

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  OPENTIDE_REPO_ROOT: ${{ github.workspace }}

jobs:
  catalogue-tests:
    name: Catalogue tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout library
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run catalogue tests
        run: pytest --cov=migrate_trunk_models --cov-fail-under=98 --cov-report=term-missing

  validate-pypi:
    name: Validate (PyPI opentide)
    runs-on: ubuntu-latest
    needs: catalogue-tests
    steps:
      - name: Checkout library
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install released opentide
        run: pip install opentide

      - name: Generate schemas and templates
        run: |
          opentide generate schemas
          opentide generate templates

      - name: Validate objects
        run: opentide validate --strict

      - name: Generate documentation
        run: opentide generate docs --output docs --flavor github

  validate-development:
    name: Validate (opentide development HEAD)
    runs-on: ubuntu-latest
    needs: catalogue-tests
    continue-on-error: true
    steps:
      - name: Checkout library
        uses: actions/checkout@v4

      - name: Checkout opentide development
        uses: actions/checkout@v4
        with:
          repository: opentidehq/opentide
          ref: development
          path: opentide

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install opentide from development
        run: pip install -e ./opentide

      - name: Generate schemas and templates
        run: |
          opentide generate schemas
          opentide generate templates

      - name: Validate objects against development HEAD
        run: opentide validate --strict
