# Catalogue CI — shape tests, PyPI validate, development-HEAD early warning, explorer Pages.
#
# opentide, explorer, and specifications are public. Do not require GH App / PAT /
# deploy-key credentials to clone them.
#
# The published-user contract is the PyPI job:
#   pip install opentide
#   opentide validate --strict
#
# threat.impact / threat.leverage are YAML lists (library#7). PyPI 0.1.5 still
# types those fields as str (opentide#189, blocked on specifications#12), so
# that required check stays red until a released engine accepts list[str].
#
# `opentide explorer` is not a Typer command on PyPI 0.1.5 or current
# development HEAD (github.py still emits it). Explorer CI therefore builds
# OpenTideHQ/explorer with its own Node CLI and mock corpus generator.
name: OpenTide

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  OPENTIDE_REPO_ROOT: ${{ github.workspace }}

jobs:
  catalogue-tests:
    name: Catalogue tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout library
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run catalogue tests
        run: pytest --cov=migrate_trunk_models --cov-fail-under=98 --cov-report=term-missing

  validate-pypi:
    name: Validate (PyPI opentide)
    runs-on: ubuntu-latest
    needs: catalogue-tests
    steps:
      - name: Checkout library
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install released opentide
        run: pip install opentide

      - name: Generate schemas and templates
        run: |
          opentide generate schemas
          opentide generate templates

      - name: Validate objects
        run: opentide validate --strict

      - name: Generate documentation
        run: opentide generate docs --output docs --flavor github

  validate-development:
    name: Validate (opentide development HEAD)
    runs-on: ubuntu-latest
    needs: catalogue-tests
    continue-on-error: true
    steps:
      - name: Checkout library
        uses: actions/checkout@v4

      - name: Checkout opentide development
        uses: actions/checkout@v4
        with:
          repository: OpenTideHQ/opentide
          ref: development
          path: opentide

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install opentide from development
        run: pip install -e "./opentide[cli]"

      - name: Generate schemas and templates
        run: |
          opentide generate schemas
          opentide generate templates

      - name: Validate objects against development HEAD
        run: opentide validate --strict

  explorer:
    name: Build explorer
    runs-on: ubuntu-latest
    needs: catalogue-tests
    steps:
      - name: Checkout library
        uses: actions/checkout@v4

      - name: Checkout explorer
        uses: actions/checkout@v4
        with:
          repository: OpenTideHQ/explorer
          ref: main
          path: explorer

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: explorer/pnpm-lock.yaml

      - name: Install explorer dependencies
        working-directory: explorer
        run: pnpm install --frozen-lockfile

      - name: Build explorer static site
        working-directory: explorer
        env:
          OPENTIDE_REPO_ROOT: ${{ github.workspace }}
          NEXT_PUBLIC_BASE_PATH: /library
        run: |
          node scripts/generate-mock-bundle.mjs
          pnpm exec next build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./explorer/out

  deploy-explorer:
    name: Deploy explorer to GitHub Pages
    runs-on: ubuntu-latest
    needs: explorer
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
